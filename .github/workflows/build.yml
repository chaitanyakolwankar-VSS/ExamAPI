# Builds and tests the API on every push to master (and on pull requests), and packages what the
# server needs: the published API, the database scripts and the install guide (deploy/DEPLOY_GUIDE.md).
# Download the "gradesphere-api" artifact from the run's page on GitHub. No secrets are used: the
# server's settings live only on the server (appsettings.Production.json).
name: Build API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Placeholders so the design-time host starts for `dotnet ef migrations script`; nothing connects.
      ConnectionStrings__DefaultConnection: "Server=(none);Database=GradeSphereApp;Integrated Security=true"
      Jwt__Key: "ci-placeholder-signing-key-not-used-anywhere-000000"
      DOTNET_NOLOGO: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore ExamAPI.sln
          dotnet tool restore

      - name: Build
        run: dotnet build ExamAPI.sln -c Release --no-restore

      - name: Test
        run: dotnet test ExamAPI.Tests/ExamAPI.Tests.csproj -c Release --no-build

      - name: Model matches the migrations
        run: dotnet ef migrations has-pending-model-changes --project ExamAPI --configuration Release --no-build

      - name: Database script (idempotent)
        run: dotnet ef migrations script --idempotent --project ExamAPI --configuration Release --no-build -o package/database/deploy.sql

      - name: Publish
        run: dotnet publish ExamAPI/ExamAPI.csproj -c Release --no-build -o package/api

      - name: Package
        shell: pwsh
        run: |
          Copy-Item deploy/SeedStarterTemplates.sql, deploy/CreateDatabase.sql package/database/
          New-Item -ItemType Directory -Force package/server | Out-Null
          Copy-Item deploy/server/* package/server/
          Copy-Item deploy/DEPLOY_GUIDE.md package/
          Copy-Item deploy/appsettings.Production.example.json package/
          "$env:GITHUB_SHA" | Out-File package/COMMIT.txt
          if (Test-Path package/api/appsettings.json) { throw "appsettings.json must not be in the publish output" }

      - uses: actions/upload-artifact@v4
        with:
          name: gradesphere-api
          path: package/
          retention-days: 30
